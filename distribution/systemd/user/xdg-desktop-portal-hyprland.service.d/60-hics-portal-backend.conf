[Service]
# The packaged backend is selected only by systemd activation. Existing
# sessions keep the currently running service until its normal restart.
ExecStart=
ExecStart=/usr/share/hics/portal/xdg-desktop-portal-hyprland
# Wayland disconnect is a session boundary. Do not respawn against the old
# compositor environment; a new session/request can activate the backend again.
Restart=no
